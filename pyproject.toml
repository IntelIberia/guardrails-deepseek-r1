[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tfg-guardrails-bench"
version = "0.1.0"
description = "Banco de pruebas de guardrails para grandes modelos de lenguaje"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
    "nemoguardrails==0.24.1",
    "guardrails-ai==0.11.0",
    "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "mypy>=1.14,<3",
    "pytest>=8,<10",
    "types-pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
