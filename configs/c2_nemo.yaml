schema_version: 1
config_id: C2
dataset: data/attacks/development12.jsonl
seed: 42
target:
  adapter: openrouter
  model: deepseek/deepseek-r1-0528
  provider: deepinfra
judge:
  adapter: openrouter_llm
  model: openai/gpt-4.1-mini
  provider: openai
guardrails:
- adapter: nemo
  name: nemo-policy-v1
